[package]
name = "harfcraft"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.8", features = ["gpui-fast"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-panic = "0.1"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
ignore = "0.4"
fontc = "1"
harfrust = { version = "0.15", features = ["tracing"] }

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
