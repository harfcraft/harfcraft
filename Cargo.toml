[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "An experimental, UFO font IDE built in Rust using gpui-kit and Google Fontations"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/harfcraft/harfcraft"
keywords = ["font-editor", "ide", "ufo", "typography", "gpui", "fontations"]

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
