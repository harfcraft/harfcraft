[package]
name = "harfcraft"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.8.0", features = ["gpui-fast"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-panic = "0.1.3"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
async-channel = "2.5.0"
ignore = "0.4.33"
fontc = "1.0.0"
harfrust = "0.15.0"

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
